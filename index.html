<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心境探测局｜情绪防御色测试</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#241a35,#6b3d72 55%,#f0b8cc);color:#32243d;min-height:100vh}.app{max-width:560px;margin:auto;padding:12px}.card{background:#fff9f1;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #160d253d}.hero{padding:28px 22px;background:linear-gradient(135deg,#4c2c59,#a86cae);color:#fff}.brand{font-size:12px;letter-spacing:3px;opacity:.8}.hero h1{font-size:32px;line-height:1.15;margin:18px 0 8px}.hero h1 b{color:#ffe394}.hero p{line-height:1.7;font-size:14px;margin:0}.body{padding:22px}.tag{display:inline-block;background:#f2e5ff;color:#713b94;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:bold}.row{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:13px}.row select{flex:1;padding:11px;border:1px solid #ead8ef;border-radius:12px;background:#fff;color:#32243d}.btn{border:0;border-radius:13px;padding:13px 18px;background:linear-gradient(135deg,#7c3aed,#d05ba4);color:#fff;font-weight:bold;cursor:pointer}.hint{font-size:12px;color:#806b86;line-height:1.6;margin-top:14px}.hide{display:none}.meta{display:flex;justify-content:space-between;color:#8b7194;font-size:12px}.track{height:8px;background:#f0e4ee;border-radius:9px;margin:9px 0 20px}.track i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#8b5cf6,#f472b6);border-radius:9px}.q{font-size:22px;font-weight:bold;line-height:1.4;margin-bottom:16px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;border:1px solid #ead9ec;background:#fff;padding:14px;border-radius:15px;color:#32243d;cursor:pointer;font-size:14px}.opt.on{background:linear-gradient(90deg,#efe1ff,#fff0f6);border-color:#9b5cc6}.nav{display:flex;justify-content:space-between;margin-top:20px}.back{background:#fff;border:1px solid #dfcce4;color:#704b7d}.result{background:linear-gradient(160deg,#fff9f1,#f4e5ff);padding:22px}.rhero{padding:24px;border-radius:20px;color:#fff;min-height:190px;background:linear-gradient(135deg,#5b3b72,#b993d6)}.rhero small{letter-spacing:2px}.rhero h2{font-size:29px;margin:45px 0 10px}.rare{display:inline-block;border:1px solid #ffffff88;background:#ffffff2e;padding:6px 10px;border-radius:20px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{text-align:center;background:#fff;border:1px solid #edddec;border-radius:13px;padding:10px}.stat b{display:block;color:#7543a1;font-size:16px}.stat small{color:#896f91}.result h3{margin:18px 0 6px}.result p{line-height:1.8;color:#604d68;font-size:14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#fff1c9;color:#805e16;padding:6px 9px;border-radius:20px;font-size:12px}.notice{font-size:11px!important;color:#9a849d!important}@media(max-width:380px){.hero h1{font-size:28px}.q{font-size:20px}}
</style></head><body><main class="app"><div class="card"><section id="intro"><div class="hero"><div class="brand">心境探测局 · INNER WEATHER</div><h1>你的情绪，<br><b>有一种颜色。</b></h1><p>20个选择，探索你在亲密、冲突和不确定里，最惯用的保护方式。</p></div><div class="body"><span class="tag">原创自我探索 · 约3分钟</span><div class="row"><span>你的星座（可选）</span><select id="z"><option value="">暂不填写</option><option>白羊座</option><option>金牛座</option><option>双子座</option><option>巨蟹座</option><option>狮子座</option><option>处女座</option><option>天秤座</option><option>天蝎座</option><option>射手座</option><option>摩羯座</option><option>水瓶座</option><option>双鱼座</option></select></div><button class="btn" id="start">开始探索 →</button><div class="hint">完成后将根据回答推导更接近的MBTI气质。仅供娱乐与自我观察，不是人格诊断。</div></div></section><section id="quiz" class="body hide"><div class="meta"><span id="num"></span><span id="pct"></span></div><div class="track"><i id="bar"></i></div><div class="q" id="question"></div><div class="opts" id="opts"></div><div class="nav"><button class="btn back" id="prev">← 上一题</button><button class="btn" id="next" disabled>下一题 →</button></div></section><section id="result" class="result hide"><div class="rhero" id="rhero"><small>YOUR INNER WEATHER</small><h2 id="name"></h2><span class="rare" id="rare"></span></div><div class="stats"><div class="stat"><b id="mbti"></b><small>接近气质</small></div><div class="stat"><b id="score"></b><small>防御倾向</small></div><div class="stat"><b id="zs">—</b><small>星座参考</small></div></div><div class="chips" id="chips"></div><h3>你是怎样保护自己的？</h3><p id="desc"></p><p><b>隐藏需求：</b><span id="need"></span></p><p><b>给你的提醒：</b><span id="tip"></span></p><button class="btn" id="again">再探索一次</button><p class="notice">本测试用于娱乐和自我观察，不构成心理诊断、医学建议或MBTI官方测评。</p></section></div></main><script>
const qs=["重要的人突然冷淡，你会？","发生冲突时，你更像？","你最怕关系变成？","别人夸你时，你会？","压力大时，你最想？","你如何理解拒绝？","暧昧里你最需要？","你的脆弱通常会？","朋友临时失约时？","做决定最顾虑？","你常被评价为？","你需要安慰时希望？","嫉妒出现时？","你容易被谁吸引？","你了解自己的情绪吗？","关系让你疲惫时？","最难说出口的是？","你怎么看依赖？","犯错时你会？","希望未来的自己？"];const os=[['先观察细节','直接问清楚','先想是不是自己错','退回自己的世界'],['慢慢理清','马上沟通','先照顾对方','离开恢复平静'],['无法被理解','长期模糊','让对方失望','失去空间'],['笑着收下','大方接受','夸回去','有点不自在'],['独处整理','讨论方案','安排好身边人的事','关掉消息'],['需要确认安全','清晰边界','怕对方不开心','慢慢疏远'],['读懂情绪','明确行动','被坚定选择','轻松不被追问'],['只给安全的人看','直接说明','藏起来','自己消化'],['嘴上没事','直接表达','替对方找理由','少主动'],['别人是否理解','是否合理','会否影响别人','会否限制自由'],['想得深','直来直往','温柔懂事','独立冷静'],['安静陪着','坦诚告知','明确说我在','给我空间'],['默默比较','直接问','怀疑自己','迅速抽离'],['有深度的人','有行动力的人','稳定回应的人','独立有边界的人'],['要时间命名','分析找办法','先发现别人','独处才知道'],['再观察','沟通规则','先忍耐','拉开距离'],['我很在意','我要答案','我也想被照顾','我不想继续'],['怕失望','互相支持','被需要安心','独立更安全'],['反复复盘','承认修正','先道歉','自己改掉'],['敢表达','理解自己','把自己放首位','放心靠近']];const types=[{n:'雾紫色 · 观察型防御',c:'linear-gradient(135deg,#5b3b72,#b993d6)',r:'稀有度18% · 月光稀有',m:'INFJ / INFP',s:'高敏感',t:['深度观察','慢热','共情力强'],d:'你习惯先观察再靠近，不是不在乎，而是希望确认安全后再交出真实的自己。你对语气、细节和关系变化很敏感。',need:'被温柔理解，不被催着表达。',tip:'适度说出感受，不必等到完全确定才开口。'},{n:'珊瑚红 · 直接型防御',c:'linear-gradient(135deg,#c2415d,#fb8c78)',r:'稀有度27% · 炽热常见',m:'ENTJ / ENTP',s:'高确定',t:['坦率','行动力','边界清晰'],d:'你倾向于把问题摊开说清楚，讨厌猜测和暧昧。你的直接背后其实有很强的在意。',need:'坦诚回应、明确态度和行动。',tip:'先说感受，再说诉求。'},{n:'奶油黄 · 照顾型防御',c:'linear-gradient(135deg,#d49635,#ffe5a0)',r:'稀有度35% · 温柔常见',m:'ENFJ / ISFJ',s:'高共情',t:['体贴','责任感','易内耗'],d:'你容易先照顾别人，再想起自己。你可能把不让别人失望当成了安全感来源。',need:'被坚定接纳，不用靠懂事换取爱。',tip:'“我需要考虑”也是合理回答。'},{n:'深海蓝 · 抽离型防御',c:'linear-gradient(135deg,#173b68,#4e86b8)',r:'稀有度20% · 深海稀有',m:'INTJ / ISTP',s:'高边界',t:['独立','克制','重空间'],d:'关系混乱时，你会退回自己的世界。距离能让你恢复秩序，但别让重要关系只剩沉默。',need:'稳定、边界和不被强迫的亲近。',tip:'离开前留一句真实说明。'}];let i=0,a=[];const $=x=>document.getElementById(x);function render(){ $('num').textContent=`第${i+1}/20题`;$('pct').textContent=Math.round((i+1)/20*100)+'%';$('bar').style.width=((i+1)/20*100)+'%';$('question').textContent=qs[i];$('opts').innerHTML='';os[i].forEach((x,n)=>{let b=document.createElement('button');b.className='opt'+(a[i]===n?' on':'');b.textContent=String.fromCharCode(65+n)+'  '+x;b.onclick=()=>{a[i]=n;document.querySelectorAll('.opt').forEach(v=>v.classList.remove('on'));b.classList.add('on');$('next').disabled=false};$('opts').appendChild(b)});$('prev').disabled=i===0;$('next').textContent=i===19?'生成结果 →':'下一题 →';$('next').disabled=a[i]===undefined}function result(){let c=[0,0,0,0];a.forEach(x=>c[x]++);let w=c.indexOf(Math.max(...c)),t=types[w];$('rhero').style.background=t.c;$('name').textContent=t.n;$('rare').textContent=t.r;$('mbti').textContent=t.m;$('score').textContent=t.s;$('zs').textContent=$('z').value||'—';$('desc').textContent=t.d;$('need').textContent=t.need;$('tip').textContent=t.tip;$('chips').innerHTML=t.t.map(x=>`<span class="chip">✦ ${x}</span>`).join('');$('quiz').classList.add('hide');$('result').classList.remove('hide')}$('start').onclick=()=>{$('intro').classList.add('hide');$('quiz').classList.remove('hide');i=0;a=[];render()};$('next').onclick=()=>{if(i===19)result();else{i++;render()}};$('prev').onclick=()=>{if(i>0){i--;render()}};$('again').onclick=()=>{$('result').classList.add('hide');$('intro').classList.remove('hide')};
</script></body></html>
